[package]
name = "concept-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
llm-sdk = { git = "https://github.com/brainless/llm-sdk", rev = "5dad1369c0325b36376a54836a5a3a5fe6a11004" }
regex = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
