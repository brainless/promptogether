[package]
name = "video-to-markdown-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "video-to-markdown"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
llm-sdk = { git = "https://github.com/brainless/llm-sdk", rev = "35e3a52ea8745b324635e9eb69d3c8084d812f10" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
mockito = "1.0"
serde_json = "1.0"
